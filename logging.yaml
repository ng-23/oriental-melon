# adapted from https://uvicorn.dev/concepts/logging/#writing-logs-to-a-file
# see also https://stackoverflow.com/a/77007723/

version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  stderr:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr

  stdout:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout

loggers:
  uvicorn.error: # for "Server-level messages (startup, shutdown, errors)"
    handlers: # see https://stackoverflow.com/questions/77001129/how-to-configure-fastapi-logging-so-that-it-works-both-with-uvicorn-locally-and#:~:text=log_config%3Dsettings.LOGGING_CONFIG)-,settings.py,Copy,-LOGGING_CONFIG%20%3D%20%7B%20%0A%20%20%20%20%27version
      - stderr
    level: INFO
    propagate: false

  uvicorn.access: # for "Per-request access log lines"
    handlers:
      - stdout
    level: INFO
    propagate: false

  oriental_melon:
    handlers:
      - stdout
    level: INFO
    propagate: false